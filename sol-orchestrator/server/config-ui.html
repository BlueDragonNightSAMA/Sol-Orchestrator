<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sol Orchestrator 模型配置</title>
  <link rel="stylesheet" href="/config-ui.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="product">Sol Orchestrator</p>
      <h1>模型配置</h1>
    </div>
    <div id="connection-status" class="status" data-state="loading">正在连接</div>
  </header>

  <main>
    <div class="workspace-row">
      <span>当前项目</span>
      <strong id="workspace">-</strong>
    </div>

    <nav class="tabs" aria-label="配置分类">
      <button class="tab active" type="button" data-tab="models" aria-selected="true">角色与模型</button>
      <button class="tab" type="button" data-tab="execution" aria-selected="false">执行策略</button>
      <button class="tab" type="button" data-tab="endpoints" aria-selected="false">端点参数</button>
    </nav>

    <form id="config-form">
      <section class="panel active" data-panel="models">
        <div class="section-heading">
          <div>
            <p class="section-index">01</p>
            <h2>角色分配</h2>
          </div>
        </div>
        <div class="field-grid three">
          <label>
            <span>主 Sol</span>
            <select id="sol-model" required></select>
          </label>
          <label>
            <span>审查模型</span>
            <select id="review-model" required></select>
          </label>
          <fieldset class="worker-field">
            <legend>工作模型</legend>
            <div id="worker-models" class="checks"></div>
          </fieldset>
        </div>

        <div class="section-heading model-heading">
          <div>
            <p class="section-index">02</p>
            <h2>模型列表</h2>
          </div>
          <button id="add-profile" class="icon-button" type="button" title="添加模型配置" aria-label="添加模型配置">+</button>
        </div>
        <div id="profile-list" class="profile-list"></div>
      </section>

      <section class="panel" data-panel="execution" hidden>
        <div class="section-heading">
          <div>
            <p class="section-index">03</p>
            <h2>运行方式</h2>
          </div>
        </div>
        <div class="field-grid three">
          <label>
            <span>工作模式</span>
            <select id="mode">
              <option value="auto">自动</option>
              <option value="manual">手动</option>
              <option value="documents">仅文档</option>
            </select>
          </label>
          <label>
            <span>执行后端</span>
            <select id="execution-backend">
              <option value="auto">自动</option>
              <option value="host-agents">子对话</option>
              <option value="api-parallel">API 并发</option>
            </select>
          </label>
          <label>
            <span>归档模式</span>
            <select id="artifact-mode">
              <option value="compact">精简</option>
              <option value="expanded">完整</option>
            </select>
          </label>
        </div>

        <fieldset class="token-fieldset">
          <legend>Token 模式</legend>
          <div class="segments">
            <label><input type="radio" name="token-mode" value="economy"><span>经济</span></label>
            <label><input type="radio" name="token-mode" value="balanced"><span>均衡</span></label>
            <label><input type="radio" name="token-mode" value="quality"><span>质量</span></label>
          </div>
        </fieldset>

        <div class="section-heading compact-heading">
          <div>
            <p class="section-index">04</p>
            <h2>任务与并发</h2>
          </div>
        </div>
        <div class="task-layout">
          <label class="auto-toggle">
            <span>任务数自动</span>
            <input id="task-auto" type="checkbox">
          </label>
          <label>
            <span>每批任务数</span>
            <input id="tasks-per-batch" type="number" min="1" max="64" value="2">
          </label>
          <label>
            <span>单批上限</span>
            <input id="max-tasks" type="number" min="1" max="64">
          </label>
          <label>
            <span>最大并发</span>
            <input id="max-parallel" type="number" min="1" max="16">
          </label>
        </div>

        <div class="section-heading compact-heading">
          <div>
            <p class="section-index">05</p>
            <h2>重试</h2>
          </div>
        </div>
        <div class="field-grid three">
          <label>
            <span>请求超时（毫秒）</span>
            <input id="request-timeout" type="number" min="1000" max="1800000" step="1000">
          </label>
          <label>
            <span>最大重试</span>
            <input id="max-retries" type="number" min="0" max="8">
          </label>
          <label>
            <span>退避基数（毫秒）</span>
            <input id="retry-base" type="number" min="100" max="30000" step="50">
          </label>
        </div>
      </section>

      <section class="panel" data-panel="endpoints" hidden>
        <div class="section-heading">
          <div>
            <p class="section-index">06</p>
            <h2>接口设置</h2>
          </div>
        </div>
        <div id="endpoint-list" class="endpoint-list"></div>
      </section>

      <div class="actionbar">
        <p id="message" role="status" aria-live="polite"></p>
        <div class="action-buttons">
          <button id="reload" class="icon-button" type="button" title="重新载入已保存配置" aria-label="重新载入已保存配置">↻</button>
          <button id="save" class="primary-button" type="submit" disabled>保存配置</button>
        </div>
      </div>
    </form>
  </main>

  <template id="profile-template">
    <article class="profile-row">
      <label>
        <span>配置名称</span>
        <input data-field="name" type="text" required>
      </label>
      <label>
        <span>模型 ID</span>
        <input data-field="model" type="text" required>
      </label>
      <label>
        <span>推理强度</span>
        <select data-field="reasoningEffort">
          <option value="default">默认</option>
          <option value="none">无</option>
          <option value="minimal">最小</option>
          <option value="low">低</option>
          <option value="medium">中</option>
          <option value="high">高</option>
          <option value="xhigh">极高</option>
        </select>
      </label>
      <button class="remove-profile icon-button" type="button" title="删除模型配置" aria-label="删除模型配置">×</button>
    </article>
  </template>

  <template id="endpoint-template">
    <article class="endpoint-row">
      <div class="endpoint-title">
        <div>
          <strong data-label="name"></strong>
          <span data-label="model"></span>
        </div>
        <span class="endpoint-state" data-label="state"></span>
      </div>
      <div class="field-grid two">
        <label class="wide">
          <span>Base URL</span>
          <input data-field="baseUrl" type="url" placeholder="http://127.0.0.1:8000/v1">
        </label>
        <label>
          <span>API Key 环境变量</span>
          <input data-field="apiKeyEnv" type="text" autocomplete="off">
        </label>
        <label>
          <span>推理字段</span>
          <input data-field="reasoningField" type="text">
        </label>
        <label>
          <span>Token 上限字段</span>
          <input data-field="maxTokensField" type="text">
        </label>
        <label class="inline-check">
          <input data-field="temperatureEnabled" type="checkbox">
          <span>发送 Temperature</span>
        </label>
      </div>
    </article>
  </template>

  <script src="/config-ui.js" defer></script>
</body>
</html>
