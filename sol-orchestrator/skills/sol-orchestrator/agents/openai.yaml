interface:
  display_name: "Sol Orchestrator"
  short_description: "Default-on conversation routing with a complete off switch"
  default_prompt: "Use $sol-orchestrator at conversation start. Read enabled state, route direct work locally, orchestrate only when justified, and do nothing when the workspace switch is off."
dependencies:
  tools:
    - type: "mcp"
      value: "sol-orchestrator"
      description: "Local Sol, Terra, and Luna orchestration server"
policy:
  allow_implicit_invocation: true
